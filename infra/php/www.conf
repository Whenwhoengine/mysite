; mysite PHP-FPM pool（Laravel 與 WordPress 各自容器、各自 pool）
[www]
user = www-data
group = www-data
listen = 9000
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php
ping.path = /fpm-ping
ping.response = pong
access.log = /dev/null
request_terminate_timeout = 60s
