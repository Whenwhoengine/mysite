# WordPress 站台共用規則（被 wp-web 各 server 區塊 include）
index index.php;
charset utf-8;
server_tokens off;
access_log /dev/stdout mysite_noquery;
client_max_body_size 34m;

include /etc/nginx/snippets/security-headers.conf;
include /etc/nginx/snippets/deny-sensitive.conf;

# 不可公開的 WP 檔案
location ~* ^/(wp-config\.php|xmlrpc\.php|readme\.html|license\.txt|wp-config-sample\.php)$ { return 404; }
location ~* ^/wp-content/(acf-json|upgrade|languages)/ { return 404; }
location ~* ^/wp-content/debug\.log$ { return 404; }

# uploads：只提供靜態檔；腳本副檔名（含雙副檔名）一律拒絕且不執行；不列目錄（INF-04）
location ^~ /wp-content/uploads/ {
    autoindex off;
    location ~* \.(php[0-9]?|phtml|phar|pht|phps|cgi|pl|py|sh|shtml|html?|svgz?|js|htaccess)(\.|$) { return 403; }
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    try_files $uri =404;
    expires 7d;
}

location ~* \.(css|js|png|jpe?g|gif|webp|ico|woff2?|ttf|eot)$ {
    try_files $uri =404;
    expires 7d;
    access_log off;
}

location / {
    try_files $uri $uri/ /index.php?$args;
}
