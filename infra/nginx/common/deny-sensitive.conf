# 不讓隱藏檔、版控、環境檔、相依目錄與備份被下載（INF-03）
location ~ /\.(?!well-known/) { deny all; return 404; }
location ~* \.(env|ini|log|sql|sql\.gz|dump|bak|swp|lock|sh|yml|yaml|dist)$ { deny all; return 404; }
location ~* ^/(vendor|node_modules|storage|bootstrap|database|tests|config|composer\.(json|lock)|package(-lock)?\.json|artisan)(/|$) { deny all; return 404; }
