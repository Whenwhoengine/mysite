# 共用安全標頭（HSTS 不在此處；正式 HTTPS 驗證後由 gateway 另行啟用）
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options $mysite_frame_options always;
# 應用已設定 Referrer-Policy（例如預覽、訂單頁的 no-referrer）時不再追加，避免較寬鬆的值覆蓋（API-13）
add_header Referrer-Policy $mysite_referrer_policy always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
