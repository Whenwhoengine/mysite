# app-web：Laravel public/ 靜態入口，PHP 交給 app-php（路徑一致：/var/www/app/public）。
# REMOTE_ADDR 保留為直接連線者（gateway 或容器內服務）；Laravel 只信任 edge 子網的 X-Forwarded-*。
server {
    listen 8080 default_server;
    server_name _;
    root /var/www/app/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 2m;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/deny-sensitive.conf;

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }

    location /build/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    # 只允許前端控制器；其他 .php 一律 404
    location = /index.php {
        include /etc/nginx/snippets/fastcgi-common.conf;
        fastcgi_pass app-php:9000;
    }
    location ~ \.php$ { return 404; }
}
