# 上游容器重建後 IP 會改變：一律經 Docker 內建 DNS 動態解析（避免把流量送到重新分配同一 IP 的其他服務）
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# app-web：Laravel public/ 靜態入口，PHP 交給 app-php（路徑一致：/var/www/app/public）。
# REMOTE_ADDR 保留為直接連線者（gateway 或容器內服務）；Laravel 只信任 edge 子網的 X-Forwarded-*。
# 存取紀錄只記路徑（$uri），不記查詢字串：預覽票券、nonce 等不得進 log（API-13、DAT-02）
log_format mysite_noquery escape=json '{"timestamp":"$time_iso8601","service":"app-web","level":"info","event":"http_access","request_id":"$http_x_request_id","status":$status,"method":"$request_method","path":"$uri","bytes":$body_bytes_sent,"duration":$request_time}';
# access_log 在各 server 區塊設定（覆寫 nginx.conf 預設含查詢字串的 main 格式）

# 上游未提供時才補預設安全標頭（空值即不送出）
map $upstream_http_referrer_policy $mysite_referrer_policy {
    "" "strict-origin-when-cross-origin";
    default "";
}
map $upstream_http_x_frame_options $mysite_frame_options {
    "" "SAMEORIGIN";
    default "";
}

server {
    listen 8080 default_server;
    server_name _;
    root /var/www/app/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 2m;
    access_log /dev/stdout mysite_noquery;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/deny-sensitive.conf;

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }

    location /build/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    # 只允許前端控制器；其他 .php 一律 404
    location = /index.php {
        include /etc/nginx/snippets/fastcgi-common.conf;
        set $mysite_php_upstream app-php:9000;
        fastcgi_pass $mysite_php_upstream;
    }
    location ~ \.php$ { return 404; }
}
